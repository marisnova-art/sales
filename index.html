    if (!this.reg) { manual && toast('서비스 워커가 아직 등록되지 않았습니다', 'err'); return; }
    try { await this.reg.update(); } catch { manual && toast('업데이트를 확인하지 못했습니다', 'err'); return; }
    if (this.reg.waiting) this.showUpdate(this.reg.waiting);
    else if (this.reg.installing) manual && toast('새 버전을 내려받는 중입니다…');
    else if (manual) toast('최신 버전을 사용 중입니다');
  },
  net() {
    if (S.ui.page === 'settings' && !Modal.isOpen() && !D.draft) render();
    if (navigator.onLine) {
      if (this._wasOff) {
        this.bar(`<i class="dot ok"></i><span>다시 온라인입니다 — 최신 데이터를 불러옵니다</span>`, '', 2600);
        if (S.store?.mode === 'supabase') loadAll();
      }
      this._wasOff = false;
    } else {
      this._wasOff = true;
      this.bar(`<i class="dot demo"></i><span>오프라인 — ${S.store?.mode === 'supabase' ? '마지막으로 불러온 데이터를 보기 전용으로 표시합니다' : '이 기기 데이터로 계속 작업할 수 있습니다'}</span>`, 'off');
    }
  },
  shortcut() {   // 앱 바로가기: #/actual?new=1 → 실적 입력 창 열기
    if (!/[?&]new=1/.test(location.hash)) return;
    history.replaceState(null, '', location.pathname + location.search + location.hash.replace(/[?&]new=1/, ''));
    if (S.items.length) openSaleModal(null);
  },
  async register() {
    if (!('serviceWorker' in navigator) || !/^https?:/.test(location.protocol)) return;
    try { this.reg = await navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }); }
    catch (e) { console.warn('[PWA] 서비스 워커 등록 실패', e); return; }
    const reg = this.reg;
    if (reg.waiting && navigator.serviceWorker.controller) this.showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state !== 'installed') return;
        if (navigator.serviceWorker.controller) this.showUpdate(nw);   // 업데이트
        else nw.postMessage({ type: 'SKIP_WAITING' });   // 첫 설치: 바로 오프라인 준비 완료
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (this.reloading || !this._updating) return; this.reloading = true; location.reload();
    });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data?.type === 'VERSION') { this.version = e.data.version; if (S.ui.page === 'settings') render(); } });
    navigator.serviceWorker.ready.then(r => r.active?.postMessage({ type: 'GET_VERSION' }));
    // 앱으로 돌아올 때 / 1시간마다 새 버전 확인
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.checkUpdate(false); });
    setInterval(() => this.checkUpdate(false), 60 * 60 * 1000);
  },
};
function pwaPanel() {

    <div class="pwa-meta">
      <div><small>상태</small><b>${esc(PWA.status())}</b></div>
      <div><small>앱 버전</small><b>${PWA.version ? 'v' + esc(PWA.version) : '—'}</b></div>
      <div><small>네트워크</small><b>${navigator.onLine ? '온라인' : '오프라인'}</b></div>
    </div>
    <div class="row">${inst ? '' : `<button class="btn pri" data-a="pwaInstall">${icon('download')}앱으로 설치</button>`}<button class="btn" data-a="pwaCheck">${icon('refresh')}업데이트 확인</button></div>
    <p class="note" style="margin-top:12px">오프라인에서는 Supabase 데이터를 볼 수만 있고, 저장은 다시 연결된 뒤에 할 수 있습니다. 데모 모드 데이터는 오프라인에서도 그대로 저장됩니다.</p></section>`;
}
Object.assign(A, {
  pwaInstall: () => { if (Modal.isOpen()) Modal.close(null); PWA.install(); },
  pwaUpdate: () => { PWA._updating = true; PWA.applyUpdate(); },
  pwaLater: () => PWA.bar(''),
  pwaCheck: () => PWA.checkUpdate(true),
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.deferred = e; PWA.syncButtons(); if (S.ui.page === 'settings') render(); });
window.addEventListener('appinstalled', () => { PWA.deferred = null; PWA.syncButtons(); toast('매출 플래너가 설치되었습니다'); });
window.addEventListener('online', () => PWA.net());
window.addEventListener('offline', () => PWA.net());
matchMedia('(display-mode: standalone)').addEventListener?.('change', () => PWA.syncButtons());
window.addEventListener('load', () => PWA.register());
PWA.syncButtons();
boot().then(() => { if (!navigator.onLine) PWA.net(); });
</script>
